name: Neural network checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reference:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check gradients, convergence, and paths
        run: python -m unittest discover -s python/tests -v
      - name: Run the seeded example
        run: python python/examples/xor_demo.py --seed 0

  cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build C++ example and tests
        run: |
          mkdir -p cpp/build
          c++ -std=c++17 -Wall -Wextra -pedantic -I cpp/NN cpp/NN/Network.cpp cpp/NN/Neuron.cpp cpp/examples/xor_demo.cpp -o cpp/build/xor_demo
          c++ -std=c++17 -Wall -Wextra -pedantic -I cpp/NN cpp/NN/Network.cpp cpp/NN/Neuron.cpp cpp/tests/network_tests.cpp -o cpp/build/network_tests
      - name: Check errors, dimensions, and convergence
        run: ./cpp/build/network_tests
      - name: Run the seeded example
        run: ./cpp/build/xor_demo --seed 0

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build C# example
        run: dotnet build csharp/NN.csproj --configuration Release
      - name: Check gradients, momentum, convergence, and data handling
        run: dotnet run --project csharp/NN.csproj --configuration Release --no-build -- --test
      - name: Run the seeded example
        run: dotnet run --project csharp/NN.csproj --configuration Release --no-build
